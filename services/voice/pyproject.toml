[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "juniper_voice"
version = "0.1.0"
description = "Juniper voice service - the entire call pipeline (Twilio <-> Deepgram Voice Agent <-> Companion turn loop <-> Medplum)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.9",
    "anthropic>=0.40",
    "websockets>=13",
    "python-dotenv>=1.0",
    "moss>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["juniper_voice*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Import the package from the source tree rather than relying on the editable
# install: setuptools' generated .pth is newline-terminated inconsistently
# across installers, and a silently-inactive editable install makes the whole
# suite fail to collect.
pythonpath = ["."]
